syntax = "proto3";
package codex_switch.menu;
option go_package = "github.com/joshp123/codex-switch/internal/menupb";
option swift_prefix = "CSSwitch_";
import "google/protobuf/timestamp.proto";

message MenuSnapshot {
  google.protobuf.Timestamp generated_at = 1;
  repeated Account accounts = 2;
  reserved 3;
  Connection connection = 4;
  repeated ReportingPeriod reporting_periods = 5;
  ProxyActivity proxy_activity = 6;
  // Each account's usage per UTC date for the last 30 days, oldest first.
  repeated AccountDay account_days = 7;
  repeated ProviderBurn provider_burns = 8;
}
message AccountDay {
  string account_key = 1;
  google.protobuf.Timestamp started_at = 2;
  int64 tokens = 3;
  optional int64 cost_nano_usd = 4;
}
message ProxyActivity {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp ended_at = 2;
  repeated ProxyAccountActivity accounts = 3;
  repeated CompletedTask tasks = 4;
  google.protobuf.Timestamp requests_started_at = 5;
}
message ProxyAccountActivity {
  string account_key = 1;
  int64 completed_responses = 2;
  int64 tokens = 3;
  ModelRequestCounts request_counts = 4;
}
message ModelRequestCounts {
  int64 requests = 1;
  int64 successful = 2;
  int64 failed = 3;
  int64 interrupted = 4;
}
message Account {
  string key = 1;
  string email = 2;
  string plan = 3;
  AccountState state = 4;
  AllowanceObservation allowance = 5;
  uint32 account_number = 6;
  bool usable = 7;
  // Why the account cannot take new work for the configured model; empty when
  // usable. It holds no time: unavailable_until is when it ends, if known.
  string unavailable_reason = 8;
  // The account's plan offers the model Codex is configured to use, so it is
  // part of the pool for current work even while its allowance is used up.
  bool offers_configured_model = 9;
  Provider provider = 10;
  // Why new work goes elsewhere while the account remains usable.
  string reserve_status = 11;
  google.protobuf.Timestamp unavailable_until = 12;
  // The account takes new work although its included allowance is used up:
  // OpenAI draws its usage credits for it.
  bool draws_credits = 13;
}
enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_CHATGPT = 1;
  PROVIDER_CLAUDE = 2;
}
enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;
  ACCOUNT_STATE_READY = 1;
  ACCOUNT_STATE_LIMITED = 2;
  ACCOUNT_STATE_SIGN_IN_REQUIRED = 3;
  ACCOUNT_STATE_CREDENTIALS_UNAVAILABLE = 4;
  ACCOUNT_STATE_USAGE_CHECK_FAILED = 5;
}
message AllowanceObservation {
  google.protobuf.Timestamp observed_at = 1;
  bool allowed = 2;
  bool limit_reached = 3;
  repeated AllowanceWindow windows = 4;
  // How many resets the account holds; absent when the provider has not said.
  // It is above zero with stored_resets empty when only the number is known:
  // the provider's list is unread or older than its count, or the proxy
  // serving the snapshot is a build that sends no list.
  optional uint32 available_reset_credits = 5;
  // The usage credit balance, which OpenAI draws once the included allowance
  // is used up; absent when OpenAI reports none.
  optional double credit_balance = 6;
  // The resets the account holds, soonest expiry first, when the provider's
  // list of them is known.
  repeated StoredReset stored_resets = 7;
}
// Resets of one kind that an account holds and that expire together.
message StoredReset {
  ResetKind kind = 1;
  uint32 count = 2;
  // Absent when the provider states no expiry.
  google.protobuf.Timestamp expires_at = 3;
}
// What a stored reset gives back when it is spent.
enum ResetKind {
  // A kind the provider names in no way this build knows.
  RESET_KIND_UNSPECIFIED = 0;
  // The weekly allowance for every model.
  RESET_KIND_WEEKLY = 1;
  // The five-hour allowance.
  RESET_KIND_FIVE_HOUR = 2;
  // The five-hour and weekly allowances.
  RESET_KIND_FULL = 3;
  // What Fable models used of the week: the Fable allowance is full again and
  // the weekly allowance regains that share. The week keeps its reset time.
  RESET_KIND_FABLE = 4;
}
message AllowanceWindow {
  int64 period_seconds = 1;
  double used_percent = 2;
  google.protobuf.Timestamp reset_at = 3;
  // Empty for a window shared by all models.
  string model_id = 4;
  string model_name = 5;
}
message CompletedTask {
  string task_id = 1;
  repeated string account_keys = 2;
  optional string title = 3;
  google.protobuf.Timestamp last_completed_at = 4;
  optional int64 tokens = 5;
  optional int64 cost_nano_usd = 6;
}
message Connection {
  bool new_tasks_configured = 1;
}

enum ReportingPeriodKind {
 REPORTING_PERIOD_UNSPECIFIED = 0;
 REPORTING_PERIOD_TODAY = 1;
 REPORTING_PERIOD_SEVEN_DAYS = 2;
 REPORTING_PERIOD_THIRTY_DAYS = 3;
}
message ReportingPeriod {
 ReportingPeriodKind kind = 1;
 google.protobuf.Timestamp started_at = 2;
 google.protobuf.Timestamp ended_at = 3;
 repeated AccountTotal accounts = 4;
 TaskUsageReport task_usage = 5;
}
message TaskUsageReport {
 repeated CompletedTask tasks = 1;
}
message AccountTotal {
 string account_key = 1;
 int64 tokens = 2;
 optional int64 cost_nano_usd = 3;
}
message ProviderBurn {
  Provider provider = 1;
  double accounts_per_week = 2;
}
