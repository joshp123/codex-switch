syntax = "proto3";
package codex_switch.t3;
option go_package = "github.com/joshp123/codex-switch/internal/t3pb";

message AuthFile {
  string id = 1;
  string auth_index = 2;
  string provider = 3;
  string email = 4;
  AuthIdentity id_token = 5;
}
message AuthIdentity { string chatgpt_account_id = 1; }
message AuthFiles { repeated AuthFile files = 1; }
message ApiCall {
  string auth_index = 1;
  string method = 2;
  string url = 3;
  map<string, string> header = 4;
  string data = 5;
}
message ApiResponse {
  int32 status_code = 1;
  string body = 2;
}
message ClaudeWindow { double utilization = 1; string resets_at = 2; }
message ClaudeModel { string display_name = 1; }
message ClaudeScope { ClaudeModel model = 1; }
message ClaudeLimit { string kind = 1; double percent = 2; string resets_at = 3; ClaudeScope scope = 4; }
message ClaudeUsage { ClaudeWindow five_hour = 1; ClaudeWindow seven_day = 2; repeated ClaudeLimit limits = 3; }
